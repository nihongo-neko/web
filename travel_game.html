<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>会話練習ゲーム</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #22c55e;
    --green-light: #dcfce7;
    --green-dark: #15803d;
    --blue: #3b82f6;
    --red: #ef4444;
    --red-light: #fee2e2;
    --bg: #f0fdf4;
    --text: #1a2e1a;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --radius: 16px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  body {
    font-family: 'Nunito', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 0 80px;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: var(--green);
    color: white;
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(34,197,94,0.3);
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .app-title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }

  .score-badge {
    background: rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 14px;
    font-weight: 700;
  }

  .trans-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    border: none;
    border-radius: 24px;
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    justify-content: center;
    font-family: inherit;
    transition: background 0.2s;
  }

  .trans-btn.on { background: white; color: var(--green-dark); }
  .trans-btn.off { background: rgba(255,255,255,0.3); color: white; }

  /* Stage tabs */
  .stage-tabs {
    display: flex;
    gap: 0;
    margin: 16px 16px 0;
    background: white;
    border-radius: 12px;
    padding: 4px;
    box-shadow: var(--shadow);
  }

  .stage-tab {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    background: transparent;
    color: var(--text-muted);
  }

  .stage-tab.active {
    background: var(--green);
    color: white;
    box-shadow: 0 2px 8px rgba(34,197,94,0.4);
  }

  /* Unit title */
  .unit-title {
    margin: 12px 16px 0;
    font-size: 16px;
    font-weight: 800;
    color: var(--green-dark);
  }

  .unit-title ruby rt { font-size: 10px; color: var(--text-muted); }

  /* Progress */
  .progress-wrap {
    margin: 12px 16px 0;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* Question card */
  .question-card {
    margin: 12px 16px 0;
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
  }

  .q-label {
    display: inline-block;
    background: var(--green-light);
    color: var(--green-dark);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  .q-topic {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 10px;
  }

  .q-topic ruby rt { font-size: 11px; color: var(--text-muted); }

  .q-text {
    font-size: 16px;
    line-height: 1.8;
    font-weight: 500;
    color: var(--text);
  }

  .q-text ruby rt { font-size: 10px; color: var(--text-muted); }

  .q-english {
    font-size: 13px;
    color: var(--text-muted);
    font-style: italic;
    margin-top: 8px;
    line-height: 1.5;
  }

  /* Choices */
  .choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 12px 16px 0;
  }

  .choice-btn {
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: var(--text);
    transition: all 0.15s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    line-height: 1.6;
  }

  .choice-btn ruby rt { font-size: 10px; color: var(--text-muted); }
  .choice-btn:active { transform: scale(0.98); }

  .choice-btn.correct {
    background: var(--green-light);
    border-color: var(--green);
    color: var(--green-dark);
  }

  .choice-btn.wrong {
    background: var(--red-light);
    border-color: var(--red);
    color: var(--red);
  }

  .choice-btn:disabled { cursor: default; }

  .choice-en {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 400;
    margin-top: 3px;
    font-style: italic;
  }

  /* Feedback */
  .feedback {
    margin: 10px 16px 0;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    display: none;
    align-items: center;
    gap: 8px;
    animation: fadeIn 0.2s ease;
  }

  .feedback.show { display: flex; }
  .feedback.correct { background: var(--green-light); color: var(--green-dark); }
  .feedback.wrong { background: var(--red-light); color: var(--red); }
  .feedback-icon { font-size: 20px; }

  /* Next button */
  .next-btn {
    display: none;
    margin: 12px 16px 0;
    width: calc(100% - 32px);
    background: var(--green);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 3px 10px rgba(34,197,94,0.35);
  }

  .next-btn.show { display: block; }
  .next-btn:active { background: var(--green-dark); }

  /* Result */
  .result-screen {
    display: none;
    margin: 20px 16px;
    text-align: center;
  }

  .result-screen.show { display: block; }
  .result-emoji { font-size: 64px; margin-bottom: 12px; }

  .result-title {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 6px;
  }

  .result-score {
    font-size: 48px;
    font-weight: 800;
    color: var(--green);
    margin: 12px 0;
  }

  .result-msg {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }

  .stars {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 8px 0 16px;
    font-size: 32px;
  }

  .restart-btn {
    background: var(--green);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px 36px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 10px;
    width: 100%;
    box-shadow: 0 3px 10px rgba(34,197,94,0.35);
  }

  .switch-btn {
    background: white;
    color: var(--green-dark);
    border: 1.5px solid var(--green);
    border-radius: 12px;
    padding: 12px 36px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div class="app-title">🌸 <ruby>会話<rt>かいわ</rt></ruby><ruby>練習<rt>れんしゅう</rt></ruby>ゲーム</div>
      <div class="score-badge">⭐ <span id="score">0</span><ruby>点<rt>てん</rt></ruby></div>
    </div>
    <button class="trans-btn off" id="transBtn" onclick="toggleTrans()">
      <span>🌐</span>
      <span id="transBtnText"><ruby>英語訳<rt>えいごやく</rt></ruby>: OFF</span>
    </button>
  </div>

  <!-- Stage tabs -->
  <div class="stage-tabs">
    <button class="stage-tab active" id="tab1" onclick="switchStage(1)">
      ステージ１<br><small style="font-weight:400;font-size:11px"><ruby>返事<rt>へんじ</rt></ruby>を<ruby>選<rt>えら</rt></ruby>ぼう</small>
    </button>
    <button class="stage-tab" id="tab2" onclick="switchStage(2)">
      ステージ２<br><small style="font-weight:400;font-size:11px"><ruby>文法<rt>ぶんぽう</rt></ruby>を<ruby>選<rt>えら</rt></ruby>ぼう</small>
    </button>
  </div>

  <!-- Unit title -->
  <div class="unit-title">⑤<ruby>旅行<rt>りょこう</rt></ruby>の<ruby>計画<rt>けいかく</rt></ruby>を<ruby>話<rt>はな</rt></ruby>しましょう</div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-info">
      <span><ruby>問題<rt>もんだい</rt></ruby> <span id="qNum">1</span> / 4</span>
      <span><ruby>正解<rt>せいかい</rt></ruby>: <span id="correctCount">0</span></span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <!-- Question -->
  <div class="question-card" id="questionCard">
    <div class="q-label">QUESTION</div>
    <div class="q-topic" id="qTopic" style="display:none"></div>
    <div class="q-text" id="qText" style="display:none"></div>
    <div class="q-english" id="qEnglish" style="display:none"></div>
  </div>

  <!-- Choices -->
  <div class="choices" id="choices"></div>

  <!-- Feedback -->
  <div class="feedback" id="feedback">
    <span class="feedback-icon" id="feedbackIcon"></span>
    <span id="feedbackText"></span>
  </div>

  <!-- Next button -->
  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
    つぎの<ruby>問題<rt>もんだい</rt></ruby>へ →
  </button>

  <!-- Result -->
  <div class="result-screen" id="resultScreen">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title"><ruby>結果<rt>けっか</rt></ruby></div>
    <div class="stars" id="starsDisplay"></div>
    <div class="result-score"><span id="finalScore">0</span> / 4</div>
    <div class="result-msg" id="resultMsg"></div>
    <button class="restart-btn" onclick="restart()">もう<ruby>一度<rt>いちど</rt></ruby><ruby>挑戦<rt>ちょうせん</rt></ruby>する 🔄</button>
    <button class="switch-btn" id="switchStageBtn" onclick="goNextStage()">ステージ２へ<ruby>進<rt>すす</rt></ruby>む →</button>
  </div>

</div>

<script>
// ===== STAGE 1 DATA =====
const stage1Answers = [
  {
    text: `どんなところがいいですか。`,
    en: "What kind of place would you like?"
  },
  {
    text: `じゃあ、<ruby>富士山<rt>ふじさん</rt></ruby>の<ruby>近<rt>ちか</rt></ruby>くはどうですか？`,
    en: "Then how about near Mt. Fuji?"
  },
  {
    text: `<ruby>湖<rt>みずうみ</rt></ruby>でボートに<ruby>乗<rt>の</rt></ruby>れますよ。<ruby>乗<rt>の</rt></ruby>りませんか？`,
    en: "You can ride a boat on the lake. Would you like to?"
  },
  {
    text: `バスが<ruby>安<rt>やす</rt></ruby>くて<ruby>便利<rt>べんり</rt></ruby>だって<ruby>先輩<rt>せんぱい</rt></ruby>が<ruby>言<rt>い</rt></ruby>ってました。`,
    en: "My senior said the bus is cheap and convenient."
  }
];

const stage1Questions = [
  {
    topic: `<ruby>行<rt>い</rt></ruby>き<ruby>先<rt>さき</rt></ruby>①`,
    topicEn: "Destination ①",
    prompt: `<ruby>行<rt>い</rt></ruby>き<ruby>先<rt>さき</rt></ruby>はどこにしますか。`,
    promptEn: "Where shall we go?",
    answerIdx: 0
  },
  {
    topic: `<ruby>行<rt>い</rt></ruby>き<ruby>先<rt>さき</rt></ruby>②`,
    topicEn: "Destination ②",
    prompt: `<ruby>私<rt>わたし</rt></ruby>は、<ruby>景色<rt>けしき</rt></ruby>がきれいなところがいいです。`,
    promptEn: "I'd like a place with beautiful scenery.",
    answerIdx: 1
  },
  {
    topic: `すること`,
    topicEn: "What to Do",
    prompt: `そこで<ruby>何<rt>なに</rt></ruby>をしますか？`,
    promptEn: "What will we do there?",
    answerIdx: 2
  },
  {
    topic: `<ruby>行<rt>い</rt></ruby>き<ruby>方<rt>かた</rt></ruby>`,
    topicEn: "How to Get There",
    prompt: `どうやって<ruby>行<rt>い</rt></ruby>きますか？`,
    promptEn: "How will we get there?",
    answerIdx: 3
  }
];

// ===== STAGE 2 DATA =====
const stage2Questions = [
  {
    topic: `<ruby>行<rt>い</rt></ruby>き<ruby>先<rt>さき</rt></ruby>①`,
    topicEn: "Destination ①",
    prompt: `A「<ruby>行<rt>い</rt></ruby>き<ruby>先<rt>さき</rt></ruby>はどこにしますか。」<br>B「（　）ところがいいですか。」`,
    promptEn: 'A: "Where shall we go?" B: "What ( ) place would you like?"',
    answer: `どんな`,
    answerEn: "donna (what kind of)",
    choices: [
      { text: `どんな`, en: "donna (what kind of)", correct: true },
      { text: `どこの`, en: "doko no (which place's)", correct: false },
      { text: `どれの`, en: "dore no (which one's)", correct: false },
      { text: `どちらの`, en: "dochira no (which)", correct: false }
    ]
  },
  {
    topic: `<ruby>行<rt>い</rt></ruby>き<ruby>先<rt>さき</rt></ruby>②`,
    topicEn: "Destination ②",
    prompt: `A「<ruby>私<rt>わたし</rt></ruby>は、<ruby>景色<rt>けしき</rt></ruby>がきれいなところがいいです。」<br>B「（　）、<ruby>富士山<rt>ふじさん</rt></ruby>の<ruby>近<rt>ちか</rt></ruby>くはどうですか？」`,
    promptEn: 'A: "I\'d like somewhere with beautiful scenery." B: "( ), how about near Mt. Fuji?"',
    answer: `じゃあ`,
    answerEn: "jaa (well then / in that case)",
    choices: [
      { text: `じゃあ`, en: "jaa (well then)", correct: true },
      { text: `でも`, en: "demo (but)", correct: false },
      { text: `それで`, en: "sorede (so)", correct: false },
      { text: `だから`, en: "dakara (therefore)", correct: false }
    ]
  },
  {
    topic: `すること`,
    topicEn: "What to Do",
    prompt: `A「そこで<ruby>何<rt>なに</rt></ruby>をしますか？」<br>B「<ruby>湖<rt>みずうみ</rt></ruby>でボートに（　）よ。<ruby>乗<rt>の</rt></ruby>りませんか？」`,
    promptEn: 'A: "What will we do there?" B: "You can ( ) a boat on the lake. Want to?"',
    answer: `<ruby>乗<rt>の</rt></ruby>れます`,
    answerEn: "noremasu (can ride)",
    choices: [
      { text: `<ruby>乗<rt>の</rt></ruby>れます`, en: "noremasu (can ride)", correct: true },
      { text: `<ruby>乗<rt>の</rt></ruby>ります`, en: "norimasu (ride)", correct: false },
      { text: `<ruby>乗<rt>の</rt></ruby>りました`, en: "norimashita (rode)", correct: false },
      { text: `<ruby>乗<rt>の</rt></ruby>りたい`, en: "noritai (want to ride)", correct: false }
    ]
  },
  {
    topic: `<ruby>行<rt>い</rt></ruby>き<ruby>方<rt>かた</rt></ruby>`,
    topicEn: "How to Get There",
    prompt: `A「どうやって<ruby>行<rt>い</rt></ruby>きますか？」<br>B「バスが<ruby>安<rt>やす</rt></ruby>くて<ruby>便利<rt>べんり</rt></ruby>だ（　）<ruby>先輩<rt>せんぱい</rt></ruby>が<ruby>言<rt>い</rt></ruby>ってました。」`,
    promptEn: 'A: "How will we get there?" B: "My senior said the bus is cheap and convenient ( )."',
    answer: `って`,
    answerEn: "tte (quotation particle, casual)",
    choices: [
      { text: `って`, en: "tte (casual quote)", correct: true },
      { text: `と`, en: "to (formal quote)", correct: false },
      { text: `から`, en: "kara (because)", correct: false },
      { text: `ので`, en: "node (because)", correct: false }
    ]
  }
];

// ===== STATE =====
let currentStage = 1;
let showTranslation = false;
let questions = [];
let qOrder = [];
let currentIdx = 0;
let score = 0;
let correctCount = 0;
let answered = false;
const TOTAL = 4;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function init() {
  questions = currentStage === 1 ? stage1Questions : stage2Questions;
  qOrder = shuffle([...Array(TOTAL).keys()]);
  currentIdx = 0;
  score = 0;
  correctCount = 0;
  document.getElementById('score').textContent = score;
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('questionCard').style.display = '';
  document.getElementById('choices').style.display = '';
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = questions[qOrder[currentIdx]];

  document.getElementById('qNum').textContent = currentIdx + 1;
  document.getElementById('progressFill').style.width = (currentIdx / TOTAL * 100) + '%';

  // Topic
  const topicEl = document.getElementById('qTopic');
  const qTextEl = document.getElementById('qText');
  if (currentStage === 1 && q.topic) {
    topicEl.innerHTML = q.topic + (showTranslation && q.topicEn ? `<span style="display:block;font-size:12px;font-weight:400;color:var(--text-muted);font-style:italic;margin-top:2px">${q.topicEn}</span>` : '');
    topicEl.style.display = 'block';
    qTextEl.style.display = 'none';
  } else {
    topicEl.innerHTML = q.topic ? q.topic + (showTranslation && q.topicEn ? `<span style="display:block;font-size:12px;font-weight:400;color:var(--text-muted);font-style:italic;margin-top:2px">${q.topicEn}</span>` : '') : '';
    topicEl.style.display = q.topic ? 'block' : 'none';
    qTextEl.innerHTML = q.prompt;
    qTextEl.style.display = 'block';
  }

  const engEl = document.getElementById('qEnglish');
  engEl.textContent = q.promptEn || '';
  engEl.style.display = (showTranslation && q.promptEn) ? 'block' : 'none';

  // Choices
  let choicesList;
  if (currentStage === 1) {
    const correctIdx = q.answerIdx;
    const otherIdxs = shuffle([...Array(TOTAL).keys()].filter(i => i !== correctIdx)).slice(0, 3);
    const selected = shuffle([correctIdx, ...otherIdxs]);
    choicesList = selected.map(i => ({
      text: stage1Answers[i].text,
      en: stage1Answers[i].en,
      correct: i === correctIdx
    }));
  } else {
    choicesList = shuffle(q.choices);
  }

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  choicesList.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = c.text + (showTranslation ? `<span class="choice-en">${c.en}</span>` : '');
    btn.dataset.correct = c.correct ? 'true' : 'false';
    btn.onclick = () => selectAnswer(c.correct, btn, choicesEl);
    choicesEl.appendChild(btn);
  });

  document.getElementById('feedback').classList.remove('show', 'correct', 'wrong');
  document.getElementById('nextBtn').classList.remove('show');
}

function selectAnswer(isCorrect, btn, container) {
  if (answered) return;
  answered = true;

  const allBtns = container.querySelectorAll('.choice-btn');
  allBtns.forEach(b => b.disabled = true);

  if (isCorrect) {
    btn.classList.add('correct');
    score += 10;
    correctCount++;
    document.getElementById('score').textContent = score;
    document.getElementById('correctCount').textContent = correctCount;
    showFeedback(true);
  } else {
    btn.classList.add('wrong');
    allBtns.forEach(b => { if (b.dataset.correct === 'true') b.classList.add('correct'); });
    showFeedback(false);
  }

  document.getElementById('nextBtn').classList.add('show');
}

function showFeedback(isCorrect) {
  const fb = document.getElementById('feedback');
  fb.classList.remove('correct', 'wrong');
  fb.classList.add('show', isCorrect ? 'correct' : 'wrong');
  document.getElementById('feedbackIcon').textContent = isCorrect ? '✅' : '❌';
  document.getElementById('feedbackText').textContent = isCorrect
    ? 'すばらしい！正解です！'
    : 'ざんねん…もう一度挑戦しよう！';
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx >= TOTAL) { showResult(); return; }
  renderQuestion();
  document.getElementById('feedback').classList.remove('show');
  document.getElementById('nextBtn').classList.remove('show');
}

function showResult() {
  document.getElementById('questionCard').style.display = 'none';
  document.getElementById('choices').style.display = 'none';
  document.getElementById('feedback').classList.remove('show');
  document.getElementById('nextBtn').classList.remove('show');
  document.getElementById('progressFill').style.width = '100%';

  const rs = document.getElementById('resultScreen');
  rs.classList.add('show');
  document.getElementById('finalScore').textContent = correctCount;

  let emoji, msg, stars;
  if (correctCount === TOTAL) {
    emoji = '🏆'; msg = 'パーフェクト！すばらしい！'; stars = '⭐⭐⭐';
  } else if (correctCount >= TOTAL / 2) {
    emoji = '😊'; msg = 'よくできました！もう少し！'; stars = '⭐⭐';
  } else {
    emoji = '💪'; msg = 'もう一度がんばろう！'; stars = '⭐';
  }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultMsg').textContent = msg;
  document.getElementById('starsDisplay').textContent = stars;

  const switchBtn = document.getElementById('switchStageBtn');
  switchBtn.textContent = currentStage === 1 ? 'ステージ２へ進む →' : 'ステージ１へ戻る ←';
}

function restart() { init(); }

function goNextStage() {
  currentStage = currentStage === 1 ? 2 : 1;
  document.getElementById('tab1').classList.toggle('active', currentStage === 1);
  document.getElementById('tab2').classList.toggle('active', currentStage === 2);
  init();
}

function switchStage(n) {
  if (currentStage === n) return;
  currentStage = n;
  document.getElementById('tab1').classList.toggle('active', n === 1);
  document.getElementById('tab2').classList.toggle('active', n === 2);
  init();
}

function toggleTrans() {
  showTranslation = !showTranslation;
  const btn = document.getElementById('transBtn');
  btn.className = 'trans-btn ' + (showTranslation ? 'on' : 'off');
  document.getElementById('transBtnText').innerHTML = showTranslation
    ? '<ruby>英語訳<rt>えいごやく</rt></ruby>: ON'
    : '<ruby>英語訳<rt>えいごやく</rt></ruby>: OFF';

  document.getElementById('qEnglish').style.display = showTranslation ? 'block' : 'none';

  const q = questions[qOrder[currentIdx]];
  const topicEl = document.getElementById('qTopic');
  if (q && q.topic) {
    topicEl.innerHTML = q.topic + (showTranslation && q.topicEn ? `<span style="display:block;font-size:12px;font-weight:400;color:var(--text-muted);font-style:italic;margin-top:2px">${q.topicEn}</span>` : '');
  }
  document.querySelectorAll('.choice-en').forEach(el => {
    el.style.display = showTranslation ? 'block' : 'none';
  });
}

init();
</script>
</body>
</html>
