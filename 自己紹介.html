<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>会話練習ゲーム</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  ruby {
    display: inline-flex;
    flex-direction: column-reverse;
    align-items: center;
    vertical-align: bottom;
    line-height: 1.4;
  }

  ruby rt {
    font-size: 10px;
    line-height: 1;
    color: var(--text-muted);
    text-align: center;
  }

  .match-item, .choice-btn, .q-topic, .q-text, .match-instruction {
    line-height: 2.2;
  }

  :root {
    --green: #22c55e;
    --green-light: #dcfce7;
    --green-dark: #15803d;
    --blue: #3b82f6;
    --blue-light: #dbeafe;
    --red: #ef4444;
    --red-light: #fee2e2;
    --yellow: #f59e0b;
    --yellow-light: #fef3c7;
    --bg: #f0fdf4;
    --card: #ffffff;
    --text: #1a2e1a;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --radius: 16px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  body {
    font-family: 'Nunito', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 0 80px;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: var(--green);
    color: white;
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(34,197,94,0.3);
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .app-title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }

  .score-badge {
    background: rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 14px;
    font-weight: 700;
  }

  /* Translation toggle */
  .trans-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: white;
    color: var(--green-dark);
    border: none;
    border-radius: 24px;
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    justify-content: center;
    font-family: inherit;
    transition: background 0.2s;
  }

  .trans-btn.on { background: white; color: var(--green-dark); }
  .trans-btn.off { background: rgba(255,255,255,0.3); color: white; }

  .trans-icon { font-size: 18px; }

  /* Stage selector */
  .stage-tabs {
    display: flex;
    gap: 0;
    margin: 16px 16px 0;
    background: white;
    border-radius: 12px;
    padding: 4px;
    box-shadow: var(--shadow);
  }

  .stage-tab {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    background: transparent;
    color: var(--text-muted);
  }

  .stage-tab.active {
    background: var(--green);
    color: white;
    box-shadow: 0 2px 8px rgba(34,197,94,0.4);
  }

  /* Progress */
  .unit-title {
    margin: 12px 16px 0;
    font-size: 16px;
    font-weight: 800;
    color: var(--green-dark);
  }

  .unit-title ruby rt { font-size: 10px; color: var(--text-muted); }

  .progress-wrap {
    margin: 12px 16px 0;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* Question card */
  .question-card {
    margin: 12px 16px 0;
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
  }

  .q-label {
    display: inline-block;
    background: var(--green-light);
    color: var(--green-dark);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  .q-topic {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 10px;
  }

  .q-topic ruby rt { font-size: 11px; color: var(--text-muted); }
    font-size: 17px;
    line-height: 1.7;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }

  .q-text ruby rt {
    font-size: 10px;
    color: var(--text-muted);
  }

  .q-english {
    font-size: 13px;
    color: var(--text-muted);
    font-style: italic;
    margin-top: 8px;
    line-height: 1.5;
  }

  /* Stage 2 fill-in */
  .fill-blank {
    display: inline-block;
    min-width: 60px;
    border-bottom: 2.5px solid var(--blue);
    color: var(--blue);
    font-weight: 700;
    padding: 0 4px;
    margin: 0 2px;
  }

  /* Choices */
  .choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 12px 16px 0;
  }

  .choice-btn {
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: var(--text);
    transition: all 0.15s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    line-height: 1.6;
  }

  .choice-btn ruby rt {
    font-size: 10px;
    color: var(--text-muted);
  }

  .choice-btn:active { transform: scale(0.98); }

  .choice-btn.correct {
    background: var(--green-light);
    border-color: var(--green);
    color: var(--green-dark);
  }

  .choice-btn.wrong {
    background: var(--red-light);
    border-color: var(--red);
    color: var(--red);
  }

  .choice-btn:disabled { cursor: default; }

  .choice-en {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 400;
    margin-top: 3px;
    font-style: italic;
  }

  /* Feedback */
  .feedback {
    margin: 10px 16px 0;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    display: none;
    align-items: center;
    gap: 8px;
    animation: fadeIn 0.2s ease;
  }

  .feedback.show { display: flex; }
  .feedback.correct { background: var(--green-light); color: var(--green-dark); }
  .feedback.wrong { background: var(--red-light); color: var(--red); }
  .feedback-icon { font-size: 20px; }

  /* Next button */
  .next-btn {
    display: none;
    margin: 12px 16px 0;
    width: calc(100% - 32px);
    background: var(--green);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
    box-shadow: 0 3px 10px rgba(34,197,94,0.35);
  }

  .next-btn.show { display: block; }
  .next-btn:active { background: var(--green-dark); }

  /* Result screen */
  .result-screen {
    display: none;
    margin: 20px 16px;
    text-align: center;
  }

  .result-screen.show { display: block; }

  .result-emoji { font-size: 64px; margin-bottom: 12px; }

  .result-title {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 6px;
  }

  .result-score {
    font-size: 48px;
    font-weight: 800;
    color: var(--green);
    margin: 12px 0;
  }

  .result-msg {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }

  .restart-btn {
    background: var(--green);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px 36px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 10px;
    width: 100%;
    box-shadow: 0 3px 10px rgba(34,197,94,0.35);
  }

  .switch-btn {
    background: white;
    color: var(--green-dark);
    border: 1.5px solid var(--green);
    border-radius: 12px;
    padding: 12px 36px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
  }

  .stars {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 8px 0 16px;
    font-size: 32px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .pop { animation: pop 0.3s ease; }

  /* ===== MATCHING GAME (Stage 1) ===== */
  .match-container {
    margin: 12px 16px 0;
    position: relative;
  }

  .match-instruction {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 10px;
    font-weight: 600;
  }

  .match-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    position: relative;
  }

  .match-col { display: flex; flex-direction: column; gap: 8px; }

  .match-item {
    background: white;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    line-height: 1.4;
    transition: all 0.15s;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .match-item ruby rt { font-size: 9px; color: var(--text-muted); }

  .match-item.selected {
    border-color: var(--blue);
    background: var(--blue-light);
    color: var(--blue);
  }

  .match-item.left-item {
    border-color: #93c5fd;
    background: #eff6ff;
    color: #1d4ed8;
  }

  .match-item.right-item {
    border-color: #fca5a5;
    background: #fff1f2;
    color: #b91c1c;
  }

  .match-item.left-item.selected {
    border-color: var(--blue);
    background: var(--blue-light);
    color: var(--blue);
  }

  .match-item.left-item.matched-correct,
  .match-item.right-item.matched-correct {
    border-color: var(--green);
    background: var(--green-light);
    color: var(--green-dark);
  }

  .match-item.left-item.matched-wrong,
  .match-item.right-item.matched-wrong {
    border-color: var(--red);
    background: var(--red-light);
    color: var(--red);
  }
    border-color: var(--green);
    background: var(--green-light);
    color: var(--green-dark);
    cursor: default;
  }

  .match-item.matched-wrong {
    border-color: var(--red);
    background: var(--red-light);
    color: var(--red);
  }

  .match-item:active:not(.matched-correct) { transform: scale(0.97); }

  /* SVG line canvas */
  #lineCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  .match-check-btn {
    display: none;
    margin: 12px 0 0;
    width: 100%;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 3px 10px rgba(34,197,94,0.35);
  }

  .match-check-btn.show { display: block; }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div class="app-title">🌸 会話<ruby>練習<rt>れんしゅう</rt></ruby>ゲーム</div>
      <div class="score-badge">⭐ <span id="score">0</span><ruby>点<rt>てん</rt></ruby></div>
    </div>
    <button class="trans-btn off" id="transBtn" onclick="toggleTrans()">
      <span class="trans-icon">🌐</span>
      <span id="transBtnText"><ruby>英語訳<rt>えいごやく</rt></ruby>: OFF</span>
    </button>
  </div>

  <!-- Stage tabs -->
  <div class="stage-tabs">
    <button class="stage-tab active" id="tab1" onclick="switchStage(1)">
      ステージ１<br><small style="font-weight:400;font-size:11px"><ruby>何<rt>なん</rt></ruby>て<ruby>言<rt>い</rt></ruby>う？</small>
    </button>
    <button class="stage-tab" id="tab2" onclick="switchStage(2)">
      ステージ２<br><small style="font-weight:400;font-size:11px"><ruby>文法<rt>ぶんぽう</rt></ruby>を<ruby>選<rt>えら</rt></ruby>ぼう</small>
    </button>
    <button class="stage-tab" id="tab3" onclick="switchStage(3)">
      ステージ３<br><small style="font-weight:400;font-size:11px"><ruby>返事<rt>へんじ</rt></ruby>を<ruby>選<rt>えら</rt></ruby>ぼう</small>
    </button>
  </div>

  <!-- Unit title -->
  <div class="unit-title" id="unitTitle">①<ruby>自己紹介<rt>じこしょうかい</rt></ruby></div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-info">
      <span><ruby>問題<rt>もんだい</rt></ruby> <span id="qNum">1</span> / <span id="qTotal">6</span></span>
      <span><ruby>正解<rt>せいかい</rt></ruby>: <span id="correctCount">0</span></span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <!-- Question -->
  <div class="question-card" id="questionCard">
    <div class="q-label" id="qLabel">QUESTION</div>
    <div class="q-topic" id="qTopic" style="display:none"></div>
    <div class="q-text" id="qText" style="display:none"></div>
    <div class="q-english" id="qEnglish" style="display:none"></div>
  </div>

  <!-- Choices (Stage 2) -->
  <div class="choices" id="choices"></div>

  <!-- Matching game (Stage 1) -->
  <div class="match-container" id="matchContainer" style="display:none">
    <div class="match-instruction" id="matchInstruction">左タップ→右タップで正しいペアを選ぼう</div>
    <div class="match-columns" id="matchColumns">
      <svg id="lineCanvas"></svg>
      <div class="match-col" id="leftCol"></div>
      <div class="match-col" id="rightCol"></div>
    </div>
    <button class="match-check-btn" id="matchCheckBtn" onclick="checkMatches()" style="display:none"></button>
  </div>

  <!-- Feedback -->
  <div class="feedback" id="feedback">
    <span class="feedback-icon" id="feedbackIcon"></span>
    <span id="feedbackText"></span>
  </div>

  <!-- Next button -->
  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
    つぎの<ruby>問題<rt>もんだい</rt></ruby>へ →
  </button>

  <!-- Result -->
  <div class="result-screen" id="resultScreen">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title"><ruby>結果<rt>けっか</rt></ruby></div>
    <div class="stars" id="starsDisplay"></div>
    <div class="result-score"><span id="finalScore">0</span> / <span id="finalTotal">6</span></div>
    <div class="result-msg" id="resultMsg"></div>
    <button class="restart-btn" onclick="restart()">もう一度<ruby>挑戦<rt>ちょうせん</rt></ruby>する 🔄</button>
    <button class="switch-btn" id="switchStageBtn" onclick="goNextStage()">ステージ２へ進む →</button>
  </div>

</div>

<script>
// ===== DATA =====
const stage1Answers = [
  {
    text: `グエン・ティ・ホンと申します。ホアと呼んでください。`,
    en: "My name is Nguyen Thi Hong. Please call me Hoa."
  },
  {
    text: `ホアは「花」という意味です。`,
    en: 'Hoa means "flower."'
  },
  {
    text: `ベトナムのダナンという町から来ました。`,
    en: "I came from Da Nang, Vietnam."
  },
  {
    text: `先週、日本に来たばかりです。`,
    en: "I just came to Japan last week."
  },
  {
    text: `趣味は音楽を聞くことです。`,
    en: "My hobby is listening to music."
  },
  {
    text: `どうぞよろしくお願いします。`,
    en: "I look forward to working with you."
  },
  {
    text: `はじめまして。`,
    en: "Nice to meet you."
  },
  {
    text: `ベトナムでは、ホテルで働いていました。`,
    en: "In Vietnam, I worked at a hotel."
  },
  {
    text: `日本語は、日本に来る前に、１年間勉強しました。`,
    en: "I studied Japanese for one year before coming to Japan."
  }
];

const stage1Questions = [
  {
    topic: `名前・呼び方`,
    topicEn: "Name & What to Call You",
    prompt: `はじめまして。お名前は？`,
    promptEn: "Nice to meet you. What is your name?",
    answerIdx: 0
  },
  {
    topic: `名前の意味`,
    topicEn: "Meaning of Your Name",
    prompt: `ホアさん、名前はどんな意味ですか？`,
    promptEn: "Hoa, what does your name mean?",
    answerIdx: 1
  },
  {
    topic: `出身`,
    topicEn: "Where You're From",
    prompt: `どちらから来ましたか？`,
    promptEn: "Where are you from?",
    answerIdx: 2
  },
  {
    topic: `いつ来たか`,
    topicEn: "When You Came",
    prompt: `いつ日本に来ましたか？`,
    promptEn: "When did you come to Japan?",
    answerIdx: 3
  },
  {
    topic: `趣味`,
    topicEn: "Hobbies",
    prompt: `趣味は何ですか？`,
    promptEn: "What are your hobbies?",
    answerIdx: 4
  },
  {
    topic: `終わりのことば`,
    topicEn: "Closing Words",
    prompt: `終わりのことばをどうぞ。`,
    promptEn: "Please say your closing words.",
    answerIdx: 5
  },
  {
    topic: `はじめのことば`,
    topicEn: "Opening Words",
    prompt: `自己紹介を始めてください。`,
    promptEn: "Please start your self-introduction.",
    answerIdx: 6
  },
  {
    topic: `仕事のけいけん`,
    topicEn: "Work Experience",
    prompt: `ベトナムでの仕事は何でしたか？`,
    promptEn: "What was your job in Vietnam?",
    answerIdx: 7
  },
  {
    topic: `日本語の学習けいけん`,
    topicEn: "Japanese Study Experience",
    prompt: `日本語はいつから勉強しましたか？`,
    promptEn: "When did you start studying Japanese?",
    answerIdx: 8
  }
];

const stage2Questions = [
  {
    prompt: `名前：<br>グエン・ティ・ホンと（　）。`,
    promptEn: "My name is Nguyen Thi Hong ( ).",
    answer: `申します`,
    answerEn: "mōshimasu (polite form of 'to say')",
    choices: [
      { text: `申します`, en: "mōshimasu", correct: true },
      { text: `います`, en: "imasu", correct: false },
      { text: `話します`, en: "hanashimasu", correct: false },
      { text: `なります`, en: "narimasu", correct: false }
    ]
  },
  {
    prompt: `名前の意味：<br>ホアは「花」（　）意味です。`,
    promptEn: 'Hoa means ( ) "flower."',
    answer: `という`,
    answerEn: "to iu (meaning 'called' or 'meaning')",
    choices: [
      { text: `という`, en: "to iu", correct: true },
      { text: `とか`, en: "toka", correct: false },
      { text: `ような`, en: "yōna", correct: false },
      { text: `だから`, en: "dakara", correct: false }
    ]
  },
  {
    prompt: `呼び方：<br>ホア（　）呼んでください。`,
    promptEn: "Please call me ( ) Hoa.",
    answer: `と`,
    answerEn: "to (particle meaning 'as/by the name of')",
    choices: [
      { text: `と`, en: "to", correct: true },
      { text: `が`, en: "ga", correct: false },
      { text: `に`, en: "ni", correct: false },
      { text: `を`, en: "wo", correct: false }
    ]
  },
  {
    prompt: `いつ来たか：<br>先週、日本に来た（　）です。`,
    promptEn: "I came to Japan last week ( ).",
    answer: `ばかり`,
    answerEn: "bakari (just / only recently)",
    choices: [
      { text: `ばかり`, en: "bakari", correct: true },
      { text: `とき`, en: "toki (when)", correct: false },
      { text: `らしい`, en: "rashii", correct: false },
      { text: `まで`, en: "made", correct: false }
    ]
  },
  {
    prompt: `趣味：<br>趣味は音楽を聞く（　）です。`,
    promptEn: "My hobby is ( ) listening to music.",
    answer: `こと`,
    answerEn: "koto (nominalizer, turns verb into noun)",
    choices: [
      { text: `こと`, en: "koto", correct: true },
      { text: `もの`, en: "mono", correct: false },
      { text: `ため`, en: "tame", correct: false },
      { text: `とき`, en: "toki", correct: false }
    ]
  },
  {
    prompt: `日本語の学習経験：<br>日本語は、日本に来る（　）、1年間 勉強しました。`,
    promptEn: "I studied Japanese for one year ( ) coming to Japan.",
    answer: `前に`,
    answerEn: "mae ni (before)",
    choices: [
      { text: `前に`, en: "mae ni (before)", correct: true },
      { text: `後で`, en: "ato de (after)", correct: false },
      { text: `ですから`, en: "desukara (therefore)", correct: false },
      { text: `ときで`, en: "toki de (when)", correct: false }
    ]
  }
];

// ===== STATE =====
let currentStage = 1;
let showTranslation = false;
let questions = [];
let qOrder = [];
let currentIdx = 0;
let score = 0;
let correctCount = 0;
let answered = false;

// Matching game state
let selectedLeft = null;   // index of selected left item
let matches = {};          // leftIdx -> rightIdx
let leftOrder = [];        // shuffled order of left items (question indices)
let rightOrder = [];       // shuffled order of right items (answer indices)

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function init() {
  questions = currentStage === 1 ? stage1Questions : currentStage === 2 ? stage2Questions : stage1Questions;
  qOrder = shuffle([...Array(questions.length).keys()]);
  currentIdx = 0;
  score = 0;
  correctCount = 0;
  document.getElementById('score').textContent = score;
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('qTotal').textContent = currentStage !== 2 ? 9 : 6;
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('feedback').classList.remove('show', 'correct', 'wrong');
  document.getElementById('nextBtn').classList.remove('show');

  if (currentStage === 1) {
    document.getElementById('questionCard').style.display = 'none';
    document.getElementById('choices').style.display = 'none';
    document.getElementById('matchContainer').style.display = 'block';
    document.getElementById('qNum').textContent = '全';
    document.getElementById('progressFill').style.width = '0%';
    renderMatchingGame();
  } else {
    document.getElementById('questionCard').style.display = '';
    document.getElementById('choices').style.display = '';
    document.getElementById('matchContainer').style.display = 'none';
    renderQuestion();
  }
}

// ===== MATCHING GAME =====
// activeQIdxs: currently displayed question indices (max 4)
// remainingQIdxs: pool not yet shown
let activeQIdxs = [];
let remainingQIdxs = [];

function renderMatchingGame() {
  selectedLeft = null;
  matches = {};

  // Init pool: all 9 questions shuffled
  const all = shuffle([...Array(9).keys()]);
  activeQIdxs = all.slice(0, 4);
  remainingQIdxs = all.slice(4);

  rebuildColumns();
  document.getElementById('matchCheckBtn').classList.remove('show');
}

function rebuildColumns() {
  selectedLeft = null;
  matches = {};
  document.getElementById('lineCanvas').innerHTML = '';
  const leftCol = document.getElementById('leftCol');
  const rightCol = document.getElementById('rightCol');
  leftCol.innerHTML = '';
  rightCol.innerHTML = '';

  // Right column: answer indices shuffled (same set as activeQIdxs but shuffled)
  const rightAIdxs = shuffle(activeQIdxs.map(qIdx => stage1Questions[qIdx].answerIdx));

  activeQIdxs.forEach((qIdx, i) => {
    const q = stage1Questions[qIdx];
    const el = document.createElement('div');
    el.className = 'match-item left-item';
    el.innerHTML = q.topic + (showTranslation && q.topicEn ? `<br><span style="font-size:10px;font-style:italic">${q.topicEn}</span>` : '');
    el.dataset.leftIdx = i;
    el.dataset.qIdx = qIdx;
    el.dataset.qIdxOrig = qIdx;
    el.onclick = () => onLeftTap(i, el);
    leftCol.appendChild(el);
  });

  rightAIdxs.forEach((aIdx, i) => {
    const a = stage1Answers[aIdx];
    const el = document.createElement('div');
    el.className = 'match-item right-item';
    el.innerHTML = a.text + (showTranslation ? `<br><span style="font-size:10px;font-style:italic">${a.en}</span>` : '');
    el.dataset.rightIdx = i;
    el.dataset.aIdx = aIdx;
    el.onclick = () => onRightTap(i, el);
    rightCol.appendChild(el);
  });

  drawLines();
}

function onLeftTap(leftIdx, el) {
  if (el.classList.contains('matched-correct')) return;
  // Deselect previous
  document.querySelectorAll('.match-item.selected').forEach(e => e.classList.remove('selected'));
  if (selectedLeft === leftIdx) { selectedLeft = null; return; }
  selectedLeft = leftIdx;
  el.classList.add('selected');
}

function onRightTap(rightIdx, el) {
  if (el.classList.contains('matched-correct')) return;
  if (selectedLeft === null) return;

  const currentLeft = selectedLeft;
  selectedLeft = null;
  document.querySelectorAll('.match-item.selected').forEach(e => e.classList.remove('selected'));

  const leftEl = document.querySelector(`[data-left-idx="${currentLeft}"]`);
  if (!leftEl) return;

  const qIdx = parseInt(leftEl.dataset.qIdx);
  const aIdx = parseInt(el.dataset.aIdx);
  const correct = stage1Questions[qIdx].answerIdx === aIdx;

  // Remove existing match for this left if any
  if (matches[currentLeft] !== undefined) {
    const oldRight = matches[currentLeft];
    const oldRightEl = document.querySelector(`[data-right-idx="${oldRight}"]`);
    if (oldRightEl) oldRightEl.classList.remove('matched-correct', 'matched-wrong', 'selected');
  }
  // Remove existing match for this right from another left
  Object.keys(matches).forEach(k => {
    if (matches[k] === rightIdx && parseInt(k) !== currentLeft) {
      const oldLeftEl = document.querySelector(`[data-left-idx="${k}"]`);
      if (oldLeftEl) oldLeftEl.classList.remove('matched-correct', 'matched-wrong', 'selected');
      delete matches[k];
    }
  });

  if (correct) {
    matches[currentLeft] = rightIdx;
    leftEl.classList.remove('selected', 'matched-wrong');
    leftEl.classList.add('matched-correct');
    el.classList.remove('matched-wrong');
    el.classList.add('matched-correct');
    score += 1;
    correctCount++;
    document.getElementById('score').textContent = score;
    document.getElementById('correctCount').textContent = correctCount;
    drawLines();

    const matchedCount = document.querySelectorAll('.left-item.matched-correct').length;
    const totalOnScreen = activeQIdxs.length;

    if (correctCount === 9) {
      document.getElementById('progressFill').style.width = '100%';
      showFeedback(true);
      setTimeout(() => showResult(), 1200);
    } else if (matchedCount >= 3 || matchedCount === totalOnScreen) {
      setTimeout(() => {
        const matchedQIdxs = [];
        document.querySelectorAll('.left-item.matched-correct').forEach(el => {
          matchedQIdxs.push(parseInt(el.dataset.qIdx));
        });

        activeQIdxs = activeQIdxs.filter(q => !matchedQIdxs.includes(q));

        const toAdd = Math.min(matchedQIdxs.length, remainingQIdxs.length);
        for (let i = 0; i < toAdd; i++) {
          activeQIdxs.push(remainingQIdxs.shift());
        }

        document.getElementById('progressFill').style.width = (correctCount / 9 * 100) + '%';
        matches = {};
        document.getElementById('lineCanvas').innerHTML = '';
        rebuildColumns();
      }, 800);
    }
  } else {
    leftEl.classList.remove('selected', 'matched-correct');
    leftEl.classList.add('matched-wrong');
    el.classList.remove('matched-correct');
    el.classList.add('matched-wrong');
    score = Math.max(0, score - 1);
    document.getElementById('score').textContent = score;
    drawLines();

    setTimeout(() => {
      leftEl.classList.remove('matched-wrong');
      el.classList.remove('matched-wrong');
      drawLines();
    }, 800);
  }
}

function drawLines() {
  const canvas = document.getElementById('lineCanvas');
  const cols = document.getElementById('matchColumns');
  const rect = cols.getBoundingClientRect();
  canvas.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
  canvas.innerHTML = '';

  Object.keys(matches).forEach(leftIdx => {
    const rightIdx = matches[leftIdx];
    const leftEl = document.querySelector(`[data-left-idx="${leftIdx}"]`);
    const rightEl = document.querySelector(`[data-right-idx="${rightIdx}"]`);
    if (!leftEl || !rightEl) return;

    const lr = leftEl.getBoundingClientRect();
    const rr = rightEl.getBoundingClientRect();
    const x1 = lr.right - rect.left;
    const y1 = lr.top + lr.height / 2 - rect.top;
    const x2 = rr.left - rect.left;
    const y2 = rr.top + rr.height / 2 - rect.top;

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', '#22c55e');
    line.setAttribute('stroke-width', '2.5');
    line.setAttribute('stroke-linecap', 'round');
    canvas.appendChild(line);
  });
}

function checkMatches() {
  let allCorrect = true;
  correctCount = 0;

  Object.keys(matches).forEach(leftIdx => {
    const rightIdx = matches[leftIdx];
    const qIdx = parseInt(document.querySelector(`[data-left-idx="${leftIdx}"]`).dataset.qIdx);
    const aIdx = parseInt(document.querySelector(`[data-right-idx="${rightIdx}"]`).dataset.aIdx);
    const correct = stage1Questions[qIdx].answerIdx === aIdx;

    const leftEl = document.querySelector(`[data-left-idx="${leftIdx}"]`);
    const rightEl = document.querySelector(`[data-right-idx="${rightIdx}"]`);

    if (correct) {
      leftEl.classList.add('matched-correct');
      rightEl.classList.add('matched-correct');
      correctCount++;
    } else {
      leftEl.classList.remove('matched-correct');
      rightEl.classList.remove('matched-correct');
      leftEl.classList.add('matched-wrong');
      rightEl.classList.add('matched-wrong');
      allCorrect = false;
    }
  });

  score = correctCount * 10;
  document.getElementById('score').textContent = score;
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('progressFill').style.width = '100%';

  drawLines();

  if (allCorrect) {
    showFeedback(true);
    setTimeout(() => showResult(), 1200);
  } else {
    showFeedback(false);
    // Allow fixing wrong ones
    document.querySelectorAll('.match-item.matched-wrong').forEach(el => {
      el.classList.remove('matched-wrong');
      // Remove from matches
      const li = el.dataset.leftIdx;
      const ri = el.dataset.rightIdx;
      if (li !== undefined) delete matches[li];
      drawLines();
    });
    document.getElementById('matchCheckBtn').classList.remove('show');
  }
}

// ===== STAGE 2 & 3 =====
function renderQuestion() {
  answered = false;
  const q = questions[qOrder[currentIdx]];

  const total = currentStage !== 2 ? 9 : 6;
  document.getElementById('qNum').textContent = currentIdx + 1;
  document.getElementById('progressFill').style.width = ((currentIdx) / total * 100) + '%';

  const topicEl = document.getElementById('qTopic');
  const qTextEl = document.getElementById('qText');

  if (currentStage === 3) {
    // Show topic label only (like old stage 1)
    topicEl.innerHTML = q.topic + (showTranslation && q.topicEn ? `<span style="display:block;font-size:12px;font-weight:400;color:var(--text-muted);font-style:italic;margin-top:2px">${q.topicEn}</span>` : '');
    topicEl.style.display = 'block';
    qTextEl.style.display = 'none';
  } else {
    topicEl.style.display = 'none';
    qTextEl.style.display = 'block';
    qTextEl.innerHTML = q.prompt;
  }

  const engEl = document.getElementById('qEnglish');
  engEl.textContent = q.promptEn || '';
  engEl.style.display = (showTranslation && q.promptEn) ? 'block' : 'none';

  let choicesList;
  if (currentStage === 3) {
    // Use all 9 correct answers as choices (show 4)
    const correctIdx = q.answerIdx;
    const otherIdxs = shuffle([...Array(9).keys()].filter(i => i !== correctIdx)).slice(0, 3);
    choicesList = shuffle([correctIdx, ...otherIdxs]).map(i => ({
      text: stage1Answers[i].text,
      en: stage1Answers[i].en,
      correct: i === correctIdx
    }));
  } else {
    choicesList = shuffle(q.choices);
  }

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  choicesList.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = c.text + (showTranslation ? `<span class="choice-en">${c.en}</span>` : '');
    btn.dataset.correct = c.correct ? 'true' : 'false';
    btn.onclick = () => selectAnswer(c.correct, btn, choicesEl);
    choicesEl.appendChild(btn);
  });

  document.getElementById('feedback').classList.remove('show', 'correct', 'wrong');
  document.getElementById('nextBtn').classList.remove('show');
}

function selectAnswer(isCorrect, btn, container) {
  if (answered) return;
  answered = true;

  const allBtns = container.querySelectorAll('.choice-btn');
  allBtns.forEach(b => b.disabled = true);

  if (isCorrect) {
    btn.classList.add('correct');
    score += 1;
    correctCount++;
    document.getElementById('score').textContent = score;
    document.getElementById('correctCount').textContent = correctCount;
    showFeedback(true);
  } else {
    btn.classList.add('wrong');
    allBtns.forEach(b => { if (b.dataset.correct === 'true') b.classList.add('correct'); });
    showFeedback(false);
  }

  document.getElementById('nextBtn').classList.add('show');
}

function showFeedback(isCorrect) {
  const fb = document.getElementById('feedback');
  fb.classList.remove('correct', 'wrong');
  fb.classList.add('show', isCorrect ? 'correct' : 'wrong');
  document.getElementById('feedbackIcon').textContent = isCorrect ? '✅' : '❌';
  document.getElementById('feedbackText').innerHTML = isCorrect
    ? 'すばらしい！<ruby>正解<rt>せいかい</rt></ruby>です！'
    : 'ざんねん…もう一度<ruby>挑戦<rt>ちょうせん</rt></ruby>しよう！';
}

function nextQuestion() {
  currentIdx++;
  const total = currentStage !== 2 ? 9 : 6;
  if (currentIdx >= total) { showResult(); return; }
  renderQuestion();
  document.getElementById('feedback').classList.remove('show');
  document.getElementById('nextBtn').classList.remove('show');
}

function showResult() {
  document.getElementById('questionCard').style.display = 'none';
  document.getElementById('choices').style.display = 'none';
  document.getElementById('matchContainer').style.display = 'none';
  document.getElementById('feedback').classList.remove('show');
  document.getElementById('nextBtn').classList.remove('show');
  document.getElementById('progressFill').style.width = '100%';

  const rs = document.getElementById('resultScreen');
  rs.classList.add('show');
  document.getElementById('finalScore').textContent = correctCount;
  const total = currentStage !== 2 ? 9 : 6;
  document.getElementById('finalTotal').textContent = total;

  let emoji, msg, stars;
  if (correctCount === total) {
    emoji = '🏆'; msg = 'パーフェクト！すばらしい！'; stars = '⭐⭐⭐';
  } else if (correctCount >= Math.floor(total * 0.6)) {
    emoji = '😊'; msg = 'よくできました！もう少し！'; stars = '⭐⭐';
  } else {
    emoji = '💪'; msg = 'もう一度がんばろう！'; stars = '⭐';
  }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultMsg').textContent = msg;
  document.getElementById('starsDisplay').textContent = stars;

  const switchBtn = document.getElementById('switchStageBtn');
  if (currentStage === 1) switchBtn.textContent = 'ステージ２へ進む →';
  else if (currentStage === 2) switchBtn.textContent = 'ステージ３へ進む →';
  else switchBtn.textContent = 'ステージ１へ戻る ←';
}

function restart() { init(); }

function goNextStage() {
  currentStage = currentStage < 3 ? currentStage + 1 : 1;
  document.getElementById('tab1').classList.toggle('active', currentStage === 1);
  document.getElementById('tab2').classList.toggle('active', currentStage === 2);
  document.getElementById('tab3').classList.toggle('active', currentStage === 3);
  init();
}

function switchStage(n) {
  if (currentStage === n) return;
  currentStage = n;
  document.getElementById('tab1').classList.toggle('active', n === 1);
  document.getElementById('tab2').classList.toggle('active', n === 2);
  document.getElementById('tab3').classList.toggle('active', n === 3);
  init();
}

function toggleTrans() {
  showTranslation = !showTranslation;
  const btn = document.getElementById('transBtn');
  btn.className = 'trans-btn ' + (showTranslation ? 'on' : 'off');
  document.getElementById('transBtnText').innerHTML = showTranslation
    ? '<ruby>英語訳<rt>えいごやく</rt></ruby>: ON'
    : '<ruby>英語訳<rt>えいごやく</rt></ruby>: OFF';

  if (currentStage === 1) {
    renderMatchingGame();
  } else if (currentStage === 3) {
    const q = questions[qOrder[currentIdx]];
    const topicEl = document.getElementById('qTopic');
    if (q && q.topic) {
      topicEl.innerHTML = q.topic + (showTranslation && q.topicEn ? `<span style="display:block;font-size:12px;font-weight:400;color:var(--text-muted);font-style:italic;margin-top:2px">${q.topicEn}</span>` : '');
    }
    document.getElementById('qEnglish').style.display = (showTranslation && questions[qOrder[currentIdx]]?.promptEn) ? 'block' : 'none';
    document.querySelectorAll('.choice-en').forEach(el => { el.style.display = showTranslation ? 'block' : 'none'; });
  } else {
    document.getElementById('qEnglish').style.display = showTranslation ? 'block' : 'none';
    document.querySelectorAll('.choice-en').forEach(el => { el.style.display = showTranslation ? 'block' : 'none'; });
  }
}

// redraw lines on resize
window.addEventListener('resize', () => { if (currentStage === 1) drawLines(); });

// Start
init();
</script>
